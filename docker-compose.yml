services:
  postgres:
    image: postgres:16
    container_name: cloudpulse-postgres
    environment:
      POSTGRES_DB: cloudpulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cloudpulse123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: cloudpulse-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cloudpulse
      DB_USER: postgres
      DB_PASSWORD: cloudpulse123
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: cloudpulse-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: